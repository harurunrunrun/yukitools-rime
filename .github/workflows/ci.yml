name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest with coverage
        run: pytest --cov=yukitools_rime --cov-report=term-missing --cov-report=xml
      - name: Build wheel
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test installed command
        run: yukitools-rime --help

  rime-reference-smoke:
    name: Rime bce5de3 smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out yukitools-rime
        uses: actions/checkout@v4
        with:
          path: yukitools-rime
      - name: Check out reference Rime
        uses: actions/checkout@v4
        with:
          repository: icpc-jag/rime
          ref: bce5de31031e81e64ec9b839ec949724678c1a8d
          path: rime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yukitools-rime/pyproject.toml
      - name: Install projects and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./rime"
          python -m pip install -e "./yukitools-rime[dev]"
      - name: Load generated configuration with reference Rime
        working-directory: yukitools-rime
        run: pytest -q tests/test_rime_smoke.py
