name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: yukitools-rime

    steps:
      - name: Check out yukitools-rime
        uses: actions/checkout@v4
        with:
          path: yukitools-rime
          fetch-depth: 0
          persist-credentials: false

      - name: Check out reference Rime
        uses: actions/checkout@v4
        with:
          repository: icpc-jag/rime
          ref: bce5de31031e81e64ec9b839ec949724678c1a8d
          path: rime
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yukitools-rime/pyproject.toml

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ../rime

      - name: Validate annotated tag and package versions
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          tree = ast.parse(
              Path("src/yukitools_rime/__init__.py").read_text(encoding="utf-8")
          )
          module_versions = []
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  continue
              value = ast.literal_eval(node.value)
              if not isinstance(value, str):
                  raise SystemExit("__version__ must be a string literal")
              module_versions.append(value)
          if len(module_versions) != 1:
              raise SystemExit("exactly one __version__ assignment is required")
          module_version = module_versions[0]
          tag = os.environ["GITHUB_REF_NAME"]
          if project_version != module_version:
              raise SystemExit(
                  f"version mismatch: pyproject={project_version}, module={module_version}"
              )
          if tag != f"v{project_version}":
              raise SystemExit(f"tag {tag} does not match package version {project_version}")
          print(f"validated release {tag}")
          PY

      - name: Run quality gates
        env:
          RIME_REFERENCE_DIR: ${{ github.workspace }}/rime
        run: |
          test -f "$RIME_REFERENCE_DIR/rime.py"
          ruff check .
          ruff format --check .
          mypy
          pytest --cov=yukitools_rime --cov-report=term-missing --cov-fail-under=80
          pytest -q tests/test_rime_smoke.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate built artifacts
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          wheel_name = f"yukitools_rime-{version}-py3-none-any.whl"
          sdist_name = f"yukitools_rime-{version}.tar.gz"
          expected = {wheel_name, sdist_name}
          dist = Path("dist")
          actual = {entry.name for entry in dist.iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected release artifacts: expected {sorted(expected)}, "
                  f"got {sorted(actual)}"
              )
          with zipfile.ZipFile(dist / wheel_name) as wheel:
              broken = wheel.testzip()
              if broken is not None:
                  raise SystemExit(f"corrupt wheel member: {broken}")
          with tarfile.open(dist / sdist_name, "r:gz") as sdist:
              expected_root = f"yukitools_rime-{version}/pyproject.toml"
              if expected_root not in sdist.getnames():
                  raise SystemExit(f"sdist is missing {expected_root}")
          print(f"validated {wheel_name} and {sdist_name}")
          PY

      - name: Smoke-test wheel in a fresh environment
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="dist/yukitools_rime-${version}-py3-none-any.whl"
          smoke_env="$RUNNER_TEMP/yukitools-rime-release-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --upgrade pip
          "$smoke_env/bin/python" -m pip install "$wheel"
          test "$("$smoke_env/bin/yukitools-rime" --version)" = "yukitools-rime ${version}"
          "$smoke_env/bin/yukitools-rime" --help > /dev/null

      - name: Store release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: |
            yukitools-rime/dist/yukitools_rime-*.whl
            yukitools-rime/dist/yukitools_rime-*.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: dist

      - name: Revalidate downloaded artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          RELEASE_VERSION="$version" python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          wheel_name = f"yukitools_rime-{version}-py3-none-any.whl"
          sdist_name = f"yukitools_rime-{version}.tar.gz"
          expected = {wheel_name, sdist_name}
          dist = Path("dist")
          actual = {entry.name for entry in dist.iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected downloaded artifacts: expected {sorted(expected)}, "
                  f"got {sorted(actual)}"
              )
          with zipfile.ZipFile(dist / wheel_name) as wheel:
              broken = wheel.testzip()
              if broken is not None:
                  raise SystemExit(f"corrupt wheel member: {broken}")
          with tarfile.open(dist / sdist_name, "r:gz") as sdist:
              expected_root = f"yukitools_rime-{version}/pyproject.toml"
              if expected_root not in sdist.getnames():
                  raise SystemExit(f"sdist is missing {expected_root}")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          wheel="dist/yukitools_rime-${version}-py3-none-any.whl"
          sdist="dist/yukitools_rime-${version}.tar.gz"

          if gh release view "$tag" > /dev/null 2>&1; then
            release_json="$(gh release view "$tag" --json assets)"
            RELEASE_JSON="$release_json" RELEASE_VERSION="$version" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RELEASE_JSON"])
          version = os.environ["RELEASE_VERSION"]
          expected = {
              f"yukitools_rime-{version}-py3-none-any.whl",
              f"yukitools_rime-{version}.tar.gz",
          }
          actual = {asset["name"] for asset in data["assets"]}
          unexpected = actual - expected
          if unexpected:
              raise SystemExit(
                  f"refusing to replace a release with unexpected assets: "
                  f"{sorted(unexpected)}"
              )
          PY
            gh release upload "$tag" "$wheel" "$sdist" --clobber
            gh release edit "$tag" --draft=false --prerelease=false
          else
            gh release create "$tag" "$wheel" "$sdist" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi

          release_json="$(
            gh release view "$tag" \
              --json tagName,isDraft,isPrerelease,assets,url
          )"
          RELEASE_JSON="$release_json" RELEASE_TAG="$tag" RELEASE_VERSION="$version" \
            python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RELEASE_JSON"])
          version = os.environ["RELEASE_VERSION"]
          expected = {
              f"yukitools_rime-{version}-py3-none-any.whl",
              f"yukitools_rime-{version}.tar.gz",
          }
          actual = {asset["name"] for asset in data["assets"]}
          if data["tagName"] != os.environ["RELEASE_TAG"]:
              raise SystemExit(f"unexpected release tag: {data['tagName']}")
          if data["isDraft"] or data["isPrerelease"]:
              raise SystemExit("release must be published and not a prerelease")
          if actual != expected:
              raise SystemExit(
                  f"unexpected release assets: expected {sorted(expected)}, "
                  f"got {sorted(actual)}"
              )
          print(data["url"])
          PY
