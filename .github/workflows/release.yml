name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-gate:
    name: Linux gate / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static analysis
        if: matrix.python-version == '3.11'
        run: |
          ruff check .
          ruff format --check .
          mypy
          mypy --strict tools/check_coverage.py tools/verify_distribution.py
      - name: Test and enforce coverage
        run: |
          python -m pytest -W error --import-mode=importlib --cov=yukitools_rime --cov-report=term-missing --cov-report=json:coverage.json
          python tools/check_coverage.py coverage.json

  windows-gate:
    name: Windows gate / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test and enforce coverage
        run: |
          python -m pytest -W error --import-mode=importlib --cov=yukitools_rime --cov-report=term-missing --cov-report=json:coverage.json
          python tools/check_coverage.py coverage.json
      - name: Windows Unicode and space-path smoke
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "yukitools-rime 雪"
          python -m yukitools_rime init "$project"
          python -m yukitools_rime --help
      - name: Fresh wheel pip/console/python-m and reserved/backslash/drive/CRLF init
        run: |
          python -m build
          python tools/verify_distribution.py --dist-dir dist --skip-sdist-install

  verify-build:
    name: Verify and build release
    needs: [linux-gate, windows-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: yukitools-rime

    steps:
      - name: Check out yukitools-rime
        uses: actions/checkout@v6
        with:
          path: yukitools-rime
          fetch-depth: 0
          persist-credentials: false

      - name: Check out reference Rime
        uses: actions/checkout@v6
        with:
          repository: icpc-jag/rime
          ref: bce5de31031e81e64ec9b839ec949724678c1a8d
          path: rime
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yukitools-rime/pyproject.toml

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"

      - name: Validate annotated tag and package versions
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" refs/remotes/origin/main
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          tree = ast.parse(
              Path("src/yukitools_rime/__init__.py").read_text(encoding="utf-8")
          )
          module_versions = []
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  continue
              value = ast.literal_eval(node.value)
              if not isinstance(value, str):
                  raise SystemExit("__version__ must be a string literal")
              module_versions.append(value)
          if len(module_versions) != 1:
              raise SystemExit("exactly one __version__ assignment is required")
          module_version = module_versions[0]
          tag = os.environ["GITHUB_REF_NAME"]
          if project_version != module_version:
              raise SystemExit(
                  f"version mismatch: pyproject={project_version}, module={module_version}"
              )
          if tag != f"v{project_version}":
              raise SystemExit(f"tag {tag} does not match package version {project_version}")
          print(f"validated release {tag}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify archives and fresh installations
        run: python tools/verify_distribution.py --dist-dir dist --rime-dir ../rime

      - name: Test all sample problems with reference Rime
        run: |
          python -m pip install -e ".[dev]"
          RIME_REFERENCE_DIR=../rime python -m pytest tests/test_samples.py -W error --import-mode=importlib

      - name: Store release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}
          path: |
            yukitools-rime/dist/yukitools_rime-*.whl
            yukitools-rime/dist/yukitools_rime-*.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out verified source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out reference Rime
        uses: actions/checkout@v6
        with:
          repository: icpc-jag/rime
          ref: bce5de31031e81e64ec9b839ec949724678c1a8d
          path: rime
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}
          path: dist

      - name: Revalidate downloaded artifacts
        run: python tools/verify_distribution.py --dist-dir dist --static-only

      - name: Preflight existing GitHub Release
        id: release_preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          set +e
          release_json="$(
            gh api "repos/${GH_REPO}/releases/tags/${tag}" 2>&1
          )"
          query_status=$?
          set -e
          if test "$query_status" -eq 0; then
            RELEASE_JSON="$release_json" RELEASE_VERSION="$version" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RELEASE_JSON"])
          version = os.environ["RELEASE_VERSION"]
          expected = {
              f"yukitools_rime-{version}-py3-none-any.whl",
              f"yukitools_rime-{version}.tar.gz",
          }
          actual = {asset["name"] for asset in data["assets"]}
          unexpected = actual - expected
          if unexpected:
              raise SystemExit(
                  f"refusing to replace a release with unexpected assets: "
                  f"{sorted(unexpected)}"
              )
          PY
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Fq "(HTTP 404)" <<<"$release_json"; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$release_json" >&2
            exit "$query_status"
          fi

      - name: Create or update GitHub Release
        id: mutate_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EXISTS: ${{ steps.release_preflight.outputs.release_exists }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          wheel="dist/yukitools_rime-${version}-py3-none-any.whl"
          sdist="dist/yukitools_rime-${version}.tar.gz"

          if test "$RELEASE_EXISTS" != "true" && test "$RELEASE_EXISTS" != "false"; then
            echo "release preflight did not report whether the release exists" >&2
            exit 1
          fi
          mutation_marker="${RUNNER_TEMP}/yukitools-rime-release-mutation-${GITHUB_RUN_ID}"
          : > "$mutation_marker"
          if test "$RELEASE_EXISTS" = "true"; then
            gh release upload "$tag" "$wheel" "$sdist" --clobber
            gh release edit "$tag" --draft=false --prerelease=false
          else
            gh release create "$tag" "$wheel" "$sdist" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi

          release_json="$(
            gh release view "$tag" \
              --json tagName,isDraft,isPrerelease,assets,url
          )"
          RELEASE_JSON="$release_json" RELEASE_TAG="$tag" RELEASE_VERSION="$version" \
            python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RELEASE_JSON"])
          version = os.environ["RELEASE_VERSION"]
          expected = {
              f"yukitools_rime-{version}-py3-none-any.whl",
              f"yukitools_rime-{version}.tar.gz",
          }
          actual = {asset["name"] for asset in data["assets"]}
          if data["tagName"] != os.environ["RELEASE_TAG"]:
              raise SystemExit(f"unexpected release tag: {data['tagName']}")
          if data["isDraft"] or data["isPrerelease"]:
              raise SystemExit("release must be published and not a prerelease")
          if actual != expected:
              raise SystemExit(
                  f"unexpected release assets: expected {sorted(expected)}, "
                  f"got {sorted(actual)}"
              )
          print(data["url"])
          PY

      - name: Re-download published asset URLs and verify wheel/sdist/Rime
        id: verify_public_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          published_dir="$(mktemp -d "${RUNNER_TEMP}/yukitools-rime-published.XXXXXX")"
          version="${GITHUB_REF_NAME#v}"
          release_json="$(
            gh api "repos/${GH_REPO}/releases/tags/${GITHUB_REF_NAME}"
          )"
          jq -e \
            '.draft == false and .prerelease == false and (.assets | length == 2)' \
            <<<"$release_json" > /dev/null
          expected_names=(
            "yukitools_rime-${version}-py3-none-any.whl"
            "yukitools_rime-${version}.tar.gz"
          )
          expected_base="https://github.com/${GH_REPO}/releases/download/${GITHUB_REF_NAME}"
          for name in "${expected_names[@]}"; do
            asset_url="$(
              jq -er --arg name "$name" \
                '.assets[] | select(.name == $name) | .browser_download_url' \
                <<<"$release_json"
            )"
            test "$asset_url" = "$expected_base/$name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              curl --disable --fail --location --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 2 \
                --proto '=https' --proto-redir '=https' \
                --output "$published_dir/$name" \
                "$asset_url"
          done
          python tools/verify_distribution.py --dist-dir "$published_dir" --rime-dir rime

      - name: Re-draft release after failed mutation or public verification
        if: ${{ failure() && (steps.mutate_release.outcome == 'failure' || steps.verify_public_release.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mutation_marker="${RUNNER_TEMP}/yukitools-rime-release-mutation-${GITHUB_RUN_ID}"
          if ! test -f "$mutation_marker"; then
            echo "release mutation did not start; cleanup is not required"
            exit 0
          fi
          if release_json="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft 2> /dev/null
          )"; then
            if test "$(jq -r '.isDraft' <<<"$release_json")" = "false"; then
              gh release edit "$GITHUB_REF_NAME" --draft=true
            fi
          fi
